<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
</head>
<body>

    <h1>Update Your Profile</h1>

    {% if result != None %}
        <div style="margin-bottom: 12px; padding: 7px; background-color: lightgray">
            {% if result.ok %}
                Profile stored!
            {% else %}
                <div>{{result.text}}</div>
            {% endif %}
        </div>
    {% endif %}

        <form method="post">
            <label for="title">Phonenr</label><br>
            <input type="text" name="mobilePhone"
                value="{{user.mobilePhone}}" />
            <br>

            <br>
            <button type="submit">Submit</button>
        </form>

    <div style="padding-top: 2rem">
    <a href="/">back</a>
    </div>
</body>
</html>
